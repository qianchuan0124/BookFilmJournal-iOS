<section class="group" id="g-report" data-group="report">
  <div class="group-head">
    <span class="group-num">04</span>
    <h2>报告</h2>
    <p>月报 / 年报 / 自定义 · 预览与分享</p>
  </div>
  <div class="screens">

    <figure>
      <div class="phone">
        <div class="page-head">
        {{SB}}
        <div class="large">
          <div>
            <h3>报告中心</h3>
            <div class="cap">复用桌面报告版式 · 支持 HTML 与 PNG 长图</div>
          </div>
          <div class="icons"><svg class="ico"><use href="#i-clock"/></svg></div>
        </div>
        <div class="title-row">
          <div class="seg gold"><span class="on">观影</span><span>读书</span></div>
        </div>
        <div class="flexb" style="padding:0 16px 4px">
          <span class="t12" style="color:var(--text3)">已生成 6 份 · 最近 11-01 09:12</span>
          <span class="tag gold">本月 2 份</span>
        </div>
        </div>
        <div class="body scroll">
          <div class="report-compose">
            <div class="chips">
              <span class="chip on">月报</span><span class="chip">年报</span><span class="chip">自定义</span><span class="chip">全部</span>
            </div>
            <div class="compose-row" style="margin-top:4px"><span class="lb">月份</span><span class="vl">2026 年 10 月 <svg class="ico xs chev"><use href="#i-chev"/></svg></span></div>
            <div class="compose-row"><span class="lb">主题</span><span class="vl"><span class="seg sm" style="width:132px;flex:0 0 132px"><span class="on">暗色</span><span>亮色</span></span></span></div>
            <div class="compose-row"><span class="lb">同时导出 PNG</span><span class="toggle"></span></div>
            <div class="btn primary mt12" style="width:100%"><svg class="ico"><use href="#i-report"/></svg>生成报告</div>
            <div class="note" style="text-align:center;padding-top:8px">报告在 App 内预览，可分享 HTML 与 PNG；封面从本地缓存读取，不依赖网络。</div>
          </div>

          <div class="section-t"><span>已生成报告 · 6 份</span><span class="link">全部</span></div>
          <div class="report-file">
            <div class="rf-ico"><svg class="ico"><use href="#i-doc"/></svg></div>
            <div class="rf-main">
              <div class="rf-title">2026 年 10 月 · 观影月报</div>
              <div class="rf-meta">14 部 · HTML + PNG · 生成于 11-01 09:12</div>
            </div>
            <span class="tag gold">最新</span>
            <svg class="ico sm" style="color:var(--text3)"><use href="#i-more"/></svg>
          </div>
          <div class="report-file">
            <div class="rf-ico"><svg class="ico"><use href="#i-doc"/></svg></div>
            <div class="rf-main">
              <div class="rf-title">2026 年 09 月 · 观影月报</div>
              <div class="rf-meta">9 部 · HTML · 生成于 10-01 08:40</div>
            </div>
            <svg class="ico sm" style="color:var(--text3)"><use href="#i-more"/></svg>
          </div>
          <div class="report-file">
            <div class="rf-ico"><svg class="ico"><use href="#i-doc"/></svg></div>
            <div class="rf-main">
              <div class="rf-title">2025 年 · 观影年报</div>
              <div class="rf-meta">86 部 · HTML + PNG · 生成于 01-06 22:18</div>
            </div>
            <svg class="ico sm" style="color:var(--text3)"><use href="#i-more"/></svg>
          </div>
          <div class="report-file">
            <div class="rf-ico"><svg class="ico"><use href="#i-doc"/></svg></div>
            <div class="rf-main"><div class="rf-title">2026 年 · 读书年报</div><div class="rf-meta">42 本 · HTML + PNG · 生成于 01-06 22:20</div></div>
            <svg class="ico sm" style="color:var(--text3)"><use href="#i-more"/></svg>
          </div>
          <div class="report-file">
            <div class="rf-ico"><svg class="ico"><use href="#i-doc"/></svg></div>
            <div class="rf-main"><div class="rf-title">2026 年 10 月 · 读书月报</div><div class="rf-meta">3 本 · HTML + PNG · 生成于 11-01 09:14</div></div>
            <svg class="ico sm" style="color:var(--text3)"><use href="#i-more"/></svg>
          </div>
          <div class="report-file">
            <div class="rf-ico"><svg class="ico"><use href="#i-doc"/></svg></div>
            <div class="rf-main"><div class="rf-title">观影 · 自定义报告</div><div class="rf-meta">28 部 · HTML · 生成于 09-18 10:20</div></div>
            <svg class="ico sm" style="color:var(--text3)"><use href="#i-more"/></svg>
          </div>
          <div class="btn ghost mt8" style="width:100%"><svg class="ico"><use href="#i-cal"/></svg>批量生成 2026 年全部月报</div>
          <div class="note">桌面按「月 / 年 / 自定义 / 全部」四档生成；手机保留同样四档，把「最近生成」做成可打开、分享、删除的清单。</div>
        </div>
        {{TABS:report}}
      </div>
      <figcaption><b>报告中心 <span class="tagline">唯一生成入口</span></b>桌面的大表单收成一张设置卡：范围 chip、月份、主题、PNG 开关和生成按钮；下方直接列出已生成报告，点开即可预览与分享。</figcaption>
    </figure>

    <figure>
      <div class="phone">
        <div class="page-head">
        {{SB}}
        <div class="nav">
          <span class="back"><svg class="ico"><use href="#i-back"/></svg>报告</span>
          <span class="nav-title">2026 年 10 月 · 观影月报</span>
          <span class="icons"><svg class="ico" style="color:var(--gold)"><use href="#i-share"/></svg></span>
        </div>
          <div class="rpt rpt-cover">
<div class="rp-top">
              <div class="rp-brand"><i>书</i><span><b>书影记录</b><br>REPORT</span></div>
              <div>
                <div class="rp-num">2026.10</div>
                <div class="rp-sub">2026 年 10 月 · 14 部观影记录</div>
              </div>
            </div>
<div class="rp-stats">
              <div class="rp-stat"><span class="k">记录</span><span class="v">14<small>部</small></span></div>
              <div class="rp-stat"><span class="k">观影天数</span><span class="v">10<small>天</small></span></div>

            </div>
          </div>
        </div>
        <div class="body scroll" style="padding-bottom:18px">
          <div class="rpt rpt-body">
            
            

            <div class="rp-sec">TOP 5 · TOP RATED</div>
            <div class="rp-hero">
              <div class="poster p-a has-cover"><img class="cover-img" src="assets/covers/movie-1292064.jpg" alt=""></div>
              <div class="rp-rank">
                <div class="it"><span class="no">01</span><div><b>楚门的世界</b><span class="st">★★★★★</span><span class="dt">2026-10-31 · 1 小时 43 分</span></div></div>
                <div class="it"><span class="no">02</span><div><b>大决战之平津战役</b><span class="st">★★★★</span><span class="dt">2026-10-30 · 2 小时 41 分</span></div></div>
                <div class="it"><span class="no">03</span><div><b>大决战之淮海战役</b><span class="st">★★★★★</span><span class="dt">2026-10-30 · 3 小时 40 分</span></div></div>
                <div class="it"><span class="no">04</span><div><b>大决战之辽沈战役</b><span class="st">★★★★★</span><span class="dt">2026-10-24 · 3 小时 29 分</span></div></div>
                <div class="it"><span class="no">05</span><div><b>疯狂的麦克斯 4：狂暴之路</b><span class="st">★★★★★</span><span class="dt">2026-10-17 · 2 小时</span></div></div>
              </div>
            </div>

            <div class="rp-sec">整合海报 · POSTER WALL</div>
            <div class="rp-wall">
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-1292064.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-1307729.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-1424551.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-1424552.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-34996127.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-3592854.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-33455421.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-26909790.jpg" alt=""></div>
              <div class="poster has-cover"><img class="cover-img" src="assets/covers/movie-26333560.jpg" alt=""></div>
            </div>

            <div class="rp-sec">观影日历 · CALENDAR</div>

              <span class="h">一</span><span class="h">二</span><span class="h">三</span><span class="h">四</span><span class="h">五</span><span class="h">六</span><span class="h">日</span>
              <span></span><span></span><span></span><span class="l1">1</span><span>2</span><span class="l2">3</span><span>4</span>
              <span class="l1">5</span><span>6</span><span>7</span><span>8</span><span class="l3">9</span><span class="l1">10</span><span>11</span>
              <span class="l2">12</span><span>13</span><span>14</span><span>15</span><span>16</span><span class="l1">17</span><span>18</span>
              <span>19</span><span>20</span><span>21</span><span>22</span><span class="l2">23</span><span>24</span><span class="l3">25</span>
              <span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span><span></span>
            </div>

            <div class="rp-sec">短评摘录 · NOTES</div>
            <div class="rp-notes">
              <div class="rp-note"><b>楚门的世界</b>什么也挡不住对远方与自由的向往。<div class="dt"><span>10.31</span><span>★★★★★</span></div></div>
              <div class="rp-note"><b>大决战之平津战役</b>东野出关，先以雷霆之势二十九小时解放天津。<div class="dt"><span>10.30</span><span>★★★★</span></div></div>
              <div class="rp-note"><b>大决战之淮海战役</b>华野与中野合力，最终全歼杜聿明部。<div class="dt"><span>10.30</span><span>★★★★★</span></div></div>
              <div class="rp-note"><b>疯狂的麦克斯 4</b>两个小时几乎一直在跑，但每一帧都在讲故事。<div class="dt"><span>10.17</span><span>★★★★★</span></div></div>

            <div class="rp-foot"><span>数据来自「书影记录」观影记录 · 共 14 部</span><span>2026-11-01 生成</span></div>
          </div>
          <div class="note">报告预览直接用 WKWebView 加载桌面版 HTML（响应式缩窄），PNG 由 WebView 快照生成，版式与桌面完全一致。</div>
        </div>
        <div class="homebar"></div>
      </div>
      <figcaption><b>报告预览 <span class="tagline">复用桌面版式</span></b>不重写 SwiftUI 图表：直接把桌面生成的 HTML 报告装进 WKWebView，一屏看到金色年份、概览、TOP 5、海报墙、日历与短评；右上角分享。</figcaption>
    </figure>

    <figure>
      <div class="phone">
        <div class="under">
          <div class="under-nav"></div>
          <div class="under-row"></div><div class="under-row"></div><div class="under-row"></div><div class="under-row"></div>
        </div>
        <div class="sheet-scrim"></div>
        <div class="sheet" style="height:612px">
          <div class="grabber"></div>
          <div class="sheet-head"><span class="link">关闭</span><span class="st">批量生成月报</span><span class="link strong">开始生成</span></div>
          <div class="sheet-body scroll">
            <div class="seg gold" style="margin-bottom:10px"><span class="on">2026 年</span><span>2025 年</span><span>2024 年</span></div>
            <div class="month-grid">
              <div class="mcell"><span class="m">1 月</span><span class="v">12 部</span></div>
              <div class="mcell"><span class="m">2 月</span><span class="v">8 部</span></div>
              <div class="mcell"><span class="m">3 月</span><span class="v">15 部</span></div>
              <div class="mcell"><span class="m">4 月</span><span class="v">10 部</span></div>
              <div class="mcell"><span class="m">5 月</span><span class="v">7 部</span></div>
              <div class="mcell"><span class="m">6 月</span><span class="v">13 部</span></div>
              <div class="mcell"><span class="m">7 月</span><span class="v">9 部</span></div>
              <div class="mcell"><span class="m">8 月</span><span class="v">11 部</span></div>
              <div class="mcell"><span class="m">9 月</span><span class="v">9 部</span></div>
              <div class="mcell on"><span class="m">10 月</span><span class="v">14 部 · 已生成</span></div>
              <div class="mcell on"><span class="m">11 月</span><span class="v">生成中 58%</span></div>
              <div class="mcell dim"><span class="m">12 月</span><span class="v">暂无记录</span></div>
            </div>
            <div class="group-card mt12">
              <div class="field"><span class="lb">生成范围</span><span class="vl">10 月、11 月（有记录）</span></div>
              <div class="field"><span class="lb">输出</span><span class="vl">HTML + PNG</span></div>
              <div class="field"><span class="lb">正在生成</span><span class="vl gold">2026-11 月报 · 8/14 部</span></div>
            </div>
            <div class="progress mt10" style="height:7px"><div class="fill" style="width:58%"></div></div>
            <div class="note">批量生成会跳过没有记录的月份；每份完成后写入「已生成报告」，可随时打开或分享。生成中关闭浮层会继续后台执行。</div>
          </div>
        </div>
      </div>
      <figcaption><b>批量生成 <span class="tagline">进度可见</span></b>桌面支持「生成全部月报」；手机把月份数据量、已生成与生成中状态放进月度网格，进度条 + 当前月份，后台继续执行。</figcaption>
    </figure>

  </div>
</section>
