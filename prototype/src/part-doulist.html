        <div class="sheet-scrim"></div>

          <div class="grabber"></div>
          <div class="sheet-head"><span class="link">取消</span><span class="st">条目信息</span><span class="link strong">保存</span></div>
          <div class="sheet-body scroll">
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
              <div style="width:56px;flex:0 0 56px;aspect-ratio:2/3;border-radius:6px;overflow:hidden">
                <div class="poster p-a" style="height:100%;aspect-ratio:auto;border-radius:6px;padding:4px"><span class="pt" style="font-size:7px">大决战</span></div>
              </div>

                <div class="t14 b600">大决战之辽沈战役</div>
                <div class="t11 mt2" style="color:var(--text3)">豆列条目 · 豆瓣来源</div>
              </div>
            </div>
            <div class="group-label">本地补充信息</div>
            <div class="group-card">
              <div class="field"><span class="lb">状态</span><span class="vl"><span class="tag read">已看</span></span></div>
              <div class="field"><span class="lb">时长（分钟）</span><span class="vl">209</span></div>
              <div class="field"><span class="lb">页数</span><span class="vl muted">书籍条目可填</span></div>
              <div class="field"><span class="lb">字数</span><span class="vl muted">书籍条目可填</span></div>
            </div>
            <div class="note">这些值只写在本地豆列条目上，用于展示与统计；书籍页数会随云备份快照同步，换设备无需重新从豆瓣补全。</div>
            <div class="group-card mt12">
              <div class="field"><span class="fl"><span class="checkbox on"><svg class="ico"><use href="#i-check"/></svg></span><span>同步时保留本地修改</span></span><span class="vl"></span></div>
            </div>
          </div>
        </div>
      </div>
      <figcaption><b>条目信息 <span class="tagline">豆列内编辑</span></b>对应桌面豆列条目的「修改时长 / 页数 / 字数」：手机用底部小表单完成，书籍条目同时支持页数与字数，数值随快照备份。</figcaption>
